<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Cuisine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <a href="home.html" class="logo">The Global Bite</a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="chinese.html">Chinese</a></li>
                <li><a href="spanish.html">Spanish</a></li>
                <li><a href="indian.html">Indian</a></li>
            </ul>
        </nav>
    </header>

    <section class="container">
        <div class="cuisine-header">
            <h1>Italian Cuisine</h1>
            <p>Traditional food.</p>
        </div>

        <div class="menu-grid">
            <!-- Dish 1 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Italian\pasta 1.jfif" alt="Naan">
                </div>
                <div class="dish-info">
                    <h3>Pasta</h3>
                    <p>Tomato sauce, parmesan cheese and pesto balls.</p>
                    <span class="price">$10</span>
                </div>
            </div>
            <!-- Dish 2 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Italian\pizza 3.jpg" alt="Noodles">
                </div>
                <div class="dish-info">
                    <h3>Pizza </h3>
                    <p>Vegetarian pizza.</p>
                    <span class="price">$8,50</span>
                </div>
            </div>
            <!-- Dish 3 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Italian\sweet 1.jpg" alt="Fried Rice">
                </div>
                <div class="dish-info">
                    <h3>Ice Cream</h3>
                    <p>Milk chocolate or black chocolate flavor</p>
                    <span class="price">$3</span>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; The Global Bite Restaurant</p>
    </footer>
