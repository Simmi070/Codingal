<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Cuisine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <a href="home.html" class="logo">The Global Bite</a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="chinese.html">Chinese</a></li>
                <li><a href="spanish.html">Spanish</a></li>
                <li><a href="italian.html">Italian</a></li>
            </ul>
        </nav>
    </header>

    <section class="container">
        <div class="cuisine-header">
            <h1>Indian Cuisine</h1>
            <p>Traditional hand-made food.</p>
        </div>

        <div class="menu-grid">
            <!-- Dish 1 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Indian\naan 2.jpg" alt="Naan">
                </div>
                <div class="dish-info">
                    <h3>Naan</h3>
                    <p>Covered in melted butter.</p>
                    <span class="price">$2</span>
                </div>
            </div>
            <!-- Dish 2 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Indian\paneer 1.jpg" alt="Noodles">
                </div>
                <div class="dish-info">
                    <h3>Paneer </h3>
                    <p>Cheese with gravy and vegetables</p>
                    <span class="price">$10</span>
                </div>
            </div>
            <!-- Dish 3 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Indian\sweets 1.jfif" alt="Fried Rice">
                </div>
                <div class="dish-info">
                    <h3>Jalebi</h3>
                    <p>Dessert</p>
                    <span class="price">$4,50</span>
                </div>
            </div>
        </div>

    <footer>
        <p>&copy; The Global Bite Restaurant</p>
