<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <a href="home.html" class="logo">The Global Bite</a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="indian.html">Indian</a></li>
                <li><a href="chinese.html">Chinese</a></li>
                <li><a href="italian.html">Italian</a></li>
            </ul>
        </nav>
    </header>

    <section class="container">
        <div class="cuisine-header">
            <h1>Spanish Cuisine</h1>
            <p>Traditional hand-made food.</p>
        </div>

        <div class="menu-grid">
            <!-- Dish 1 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Spanish\tapas 1.jpg" alt="Club Sandwich">
                </div>
                <div class="dish-info">
                    <h3>Tapa</h3>
                    <p>1 piece with pork and spinach</p>
                    <span class="price">$1
                    </span>
                </div>
            </div>
            <!-- Dish 2 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Spanish\Tortilla 1.jfif" alt="Grilled Cheese">
                </div>
                <div class="dish-info">
                    <h3>Tortilla</h3>
                    <p>Eggs and potato mixture fried in a pan.</p>
                    <span class="price">$3.99</span>
                </div>
            </div>
            <!-- Dish 3 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Spanish\postre 1.jfif" alt="BLT Sandwich">
                </div>
                <div class="dish-info">
                    <h3>Rice Pudding</h3>
                    <p>Creamy rice pudding with cinnamon</p>
                    <span class="price">$1.99</span>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; The Global Bite Restaurant</p>
    </footer>

</html>
