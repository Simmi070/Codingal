<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Cuisine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <a href="home.html" class="logo">The Global Bite</a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="indian.html">Indian</a></li>
                <li><a href="spanish.html">Spanish</a></li>
                <li><a href="italian.html">Italian</a></li>
            </ul>
        </nav>
    </header>

    <section class="container">
        <div class="cuisine-header">
            <h1>Chinese Cuisine</h1>
            <p>Traditional wok-fried delicacies.</p>
        </div>

        <div class="menu-grid">
            <!-- Dish 1 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Chinese\dumpling 1.jfif" alt="Dumplings">
                </div>
                <div class="dish-info">
                    <h3>Dumplings</h3>
                    <p>Vegetarian filling</p>
                    <span class="price">$3,50</span>
                </div>
            </div>
            <!-- Dish 2 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Chinese\noodles 1.jfif" alt="Noodles">
                </div>
                <div class="dish-info">
                    <h3>Noodles </h3>
                    <p>With vegetables and chicken</p>
                    <span class="price">$10</span>
                </div>
            </div>
            <!-- Dish 3 -->
            <div class="dish-card">
                <div class="dish-img">
                    <img src="images\Chinese\dessert 1.jpg" alt="Fried Rice">
                </div>
                <div class="dish-info">
                    <h3>Mooncake</h3>
                    <p>Mango, traditional or strawberry flavor.</p>
                    <span class="price">$9</span>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; The Global Bite Restaurant</p>
    </footer>
</body>

</html>
